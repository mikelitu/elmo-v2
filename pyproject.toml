[project]
name = "elmo-v2"
version = "2.1.0"
description = "Develop applications for IDMind's tabletop robot Elmo."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "adafruit-circuitpython-mpr121>=2.1.25",
    "flask>=3.1.2",
    "numpy==2.0.2",
    "picamera2>=0.3.33",
    "pillow>=11.3.0",
    "psutil>=7.1.3",
    "pyserial>=3.5",
    "redis>=7.0.1",
    "requests>=2.32.5",
    "flask-cors>=4.0.0",
    "opencv-python>=4.12",
    "pyzbar>=0.1.9",
]
classifiers = ["Private :: Do Not Upload"]
